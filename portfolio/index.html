<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Nazmul Photography</title>
    <link rel="icon" href="../img/Nazmul Photography Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

</head>
<div id="loader" class="div-loader">
    <div class="loader"></div>
</div>
<div id="content" style="display:none;">

    <body>

        <!-- Header -->
        <header id="header"></header>
        <div class="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>

        <!-- Portfolio Section -->
        <section id="portfolio" class="portfolio">
            <div class="container">
                <h2>Our Portfolio</h2>
                <p>Explore our diverse collection of photographs. Click any image to view it in a lightbox.</p>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="wedding">Wedding</button>
                    <button class="filter-btn" data-filter="portrait">Portrait</button>
                    <button class="filter-btn" data-filter="event">Event</button>
                    <button class="filter-btn" data-filter="nature">Nature</button>
                    <button class="filter-btn" data-filter="drone">Drone</button>
                </div>
                <div class="gallery"></div>
            </div>
        </section>

        <!-- Achievements Section -->
        <section class="achievements">
            <div class="container">
                <h2>Achievements</h2>
                <div class="achievements-grid">
                    <div class="achievement-card">
                        <div class="achievement-icon"><i class="fas fa-trophy"></i></div>
                        <div class="achievement-content">
                            <h3>Best Photographer Award</h3>
                            <p class="achievement-meta">Phoenix national photography</p>
                        </div>
                        <div class="achievement-year">2024</div>
                    </div>
                    <div class="achievement-card">
                        <div class="achievement-icon"><i class="fas fa-camera"></i></div>
                        <div class="achievement-content">
                            <h3>Top Wedding Photographer</h3>
                            <p class="achievement-meta">Sylhet Photography Circle</p>
                        </div>
                        <div class="achievement-year">2022</div>
                    </div>
                </div>
                <div class="achievements-stats">
                    <div class="stat-item">
                        <div class="stat-number" data-count="120">0</div>
                        <div class="stat-label">Weddings</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" data-count="300">0</div>
                        <div class="stat-label">Portraits</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" data-count="50">0</div>
                        <div class="stat-label">Events</div>
                    </div>
                </div>
            </div>
        </section>

        <footer id="footer"></footer>

        <script>
            // Load header
            fetch("../ui/header.html")
                .then(res => res.text())
                .then(data => document.getElementById("header").innerHTML = data);

            // Load footer
            fetch("../ui/footer.html")
                .then(res => res.text())
                .then(data => document.getElementById("footer").innerHTML = data);

            // Loader functionality
            // Wait for the page to fully load
            window.addEventListener('load', function () {
                const loader = document.getElementById('loader');
                const content = document.getElementById('content');

                // Hide the loader
                loader.style.display = 'none';

                // Show the content
                content.style.display = 'block';
            });
        </script>
        <script src="script.js"></script>

    </body>
</div>

</html>
